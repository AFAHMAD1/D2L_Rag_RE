<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask D2L</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <!-- Left sidebar: brand, new chat, saved chats, chapter info -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" />
            <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H19" />
          </svg>
        </span>
        <span>Ask D2L</span>
      </div>

      <button class="new-chat" id="new-chat" type="button">+ New chat</button>

      <div class="section-label">Recent</div>
      <nav class="chat-list" id="chat-list"></nav>

      <div class="info-card">
        <strong>Covers 4 chapters</strong>
        <ul>
          <li>Preliminaries</li>
          <li>Multilayer Perceptrons</li>
          <li>Convolutional Neural Networks</li>
          <li>Optimization Algorithms</li>
        </ul>
      </div>
    </aside>

    <!-- Dims the page behind the sidebar on mobile -->
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="spacer"></div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme"></button>
      </header>

      <!-- Scrollable chat column, centred at max 760px -->
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-column">
          <section class="empty-state" id="empty-state">
            <h1>What do you want to learn about deep learning?</h1>
            <div class="cards" id="cards"></div>
          </section>
          <section class="messages" id="messages"></section>
        </div>
      </div>

      <!-- Rounded input box; grows with text, Enter sends -->
      <footer class="input-area">
        <form class="input-box" id="ask-form">
          <textarea id="question" rows="1" placeholder="Ask about the D2L chapters..."></textarea>
          <button class="send-btn" id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
